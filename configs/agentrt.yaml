# agentrt.yaml — AgentRT 统一配置 (v0.1.2)
# 所有子系统通过此文件统一配置
# 环境变量覆盖优先级: AGENTRT_* 环境变量 > agentrt.yaml > 默认值
#
# 路径语义：${AIRY_HOME} 由 bootstrap/airy_paths_init() 展开，
# 默认 $HOME/.airymaxrt（见 agentrt/commons/platform/platform.h）。
# 禁止使用 /var/lib、/var/log、~/.agentrt 等遗留绝对路径（配置漂移铁律）。

version: "0.1.2"

# ─── 内核配置 ───
kernel:
  name: "AgentRT-Core"
  version: "0.1.2"
  log_level: "info"
  ipc:
    max_message_size: 65536
    shm_pool_size_mb: 128
  scheduler:
    max_tasks: 1024
    default_priority: 50
    time_slice_ms: 10
  memory:
    max_alloc_mb: 4096
    oom_watermark_percent: 85
    arena_default_size_kb: 64
    pool_thread_cache_max: 256
    slab_min_objs: 8
    mempool_reserved_mb: 32
    leak_scan_interval_sec: 60
    soak_test_rss_growth_percent: 5
    sensitive_zero_on_free: true
    deferred_free_delay_ms: 1000
  timer:
    precision_ms: 1
    max_timers: 10000
  error:
    verbose: false
    retention_days: 30

# ─── LLM 配置 ───
# 模型清单与提供商唯一来源（SSoT）：ecosystem/manager/model/model.yaml（同源 model.json）
#   - providers / models / global / routing（任务→模型映射）由 llm_d 经 -c <config> 加载
#   - default_provider / default_model 定义于 model.yaml 的 global 段
# 本段仅保留运行时策略；模型与策略分离，避免双源漂移。
llm:
  runtime:
    routing:
      fallback_chain: ["openai", "anthropic", "deepseek"]
      cost_budget_daily_usd: 10.0
    cache:
      enabled: true
      ttl_seconds: 3600
      max_entries: 10000

# ─── 记忆系统配置 ───
memory:
  enabled: true
  mode: "full"
  storage_path: "${AIRY_HOME}/data/memory"
  layers:
    l1:
      compression: "zstd"
    l2:
      embedder: "openai"
      embedding_dim: 1536
    l3:
      enabled: true
      max_entities: 100000
    l4:
      enabled: true
      clustering_algorithm: "hdbscan"

# ─── 安全配置 (Cupolas) ───
security:
  enabled: true
  mode: "standard"
  default_policy: "deny"
  rules: []
  sandbox:
    enabled: true
    type: "seccomp"
  permission:
    model: "rbac"
    cache_ttl_seconds: 300
  audit:
    enabled: true
    log_path: "${AIRY_HOME}/logs/daemon_audit.log"

# ─── 多 Agent 配置 ───
multi_agent:
  enabled: false
  max_concurrent_agents: 64
  communication:
    protocol: "a2a"
  collaboration:
    default_pattern: "orchestrator"
  lanes:
    enabled: true
    default_isolation: "process"

# ─── 网关配置 ───
gateway:
  enabled: true
  http:
    port: 8080
  websocket:
    enabled: true
  mcp:
    enabled: true
    enable_progress: true
    enable_cancellation: true
  a2a:
    enabled: true
    default_timeout_ms: 60000
  openai_compat:
    enabled: true

# ─── Hook 配置 ───
hooks:
  enabled: true
  hook_dirs:
    - "${AIRY_HOME}/config/hooks.d"
    - "${AIRY_HOME}/lib/hooks.d"
  global_hooks:
    on_tool_call:
      - hook: "security_audit"
        priority: 100

# ─── 插件配置 ───
plugins:
  enabled: true
  plugin_dirs:
    - "${AIRY_HOME}/lib/plugins"
    - "${AIRY_HOME}/data/plugins"
  auto_discover: true

# ─── 可观测性配置 ───
observability:
  metrics:
    enabled: true
    port: 9090
  tracing:
    enabled: false
    exporter: "otlp"
  logging:
    level: "info"
    format: "json"
  health:
    endpoint: "/healthz"
    ready_endpoint: "/readyz"