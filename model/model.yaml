# ─────────────────────────────────────────────────────────────────────────────
# ★ 第零步：LLM 服务连接（简化配置）—— 普通用户只需配置本段 + secrets.env
# ─────────────────────────────────────────────────────────────────────────────
# 模型 API 只有两种协议格式，二选一：
#   api_format: "openai"     → OpenAI Chat Completions
#                              （DeepSeek / OpenAI / 智谱 / 通义 / Kimi / 本地 vLLM 等绝大多数厂商）
#   api_format: "anthropic"  → Anthropic Messages（Claude 及 Anthropic 兼容服务）
#
# DeepSeek 官方 API 同时兼容两种格式（https://api-docs.deepseek.com）：
#   OpenAI 兼容:     base_url = "https://api.deepseek.com"          （内部路径 /chat/completions）
#   Anthropic 兼容:  base_url = "https://api.deepseek.com/anthropic"（内部路径 /messages）
#
# 只需填 4 项：
#   api_format   协议格式（openai | anthropic，必填）
#   base_url     服务根地址（不含 /chat/completions 或 /messages 后缀）
#   api_key_env  secrets.env 中的变量名（启动后填 key 无需重启，llm_d 热加载）
#   model        默认模型名（对话与双思考共用）
#
# 高级用户可删除本段，改用下方完整 providers/models 列表；
# 本段存在时优先于完整列表（普通用户无需理解下方 400 行高级 schema）。
llm:
  api_format: "openai"                  # openai | anthropic
  base_url: "https://api.deepseek.com"  # 服务根地址（厂商对照见注释）
  api_key_env: "DEEPSEEK_API_KEY"       # secrets.env 变量名
  model: "deepseek-v4-flash"            # 默认模型名

# ─────────────────────────────────────────────────────────────────────────────
# ★ 第一步：双思考（Thinkdual）三模型配置 —— 启用后对话先经批判循环
# ─────────────────────────────────────────────────────────────────────────────
# 1、说明：
#  - 双思考 = 慢思考 + 快思考 + 专业思考。对话（agent.run）会先经 think_d 走一遍
# 2、介绍：
#  - 批判循环，产出收敛的 DAG 行动计划，再交给 LLM 按计划回答。
# 3、配置：
#  - 三个思考角色各自独立配置模型（模型名须存在于上方 llm.model 或下方 models 列表）：
#      think2_slow_model：慢思考（t2）生成行动计划                    （GRAD 模型 A）
#      think1_fast_model：快思考（t1-f）对计划做终裁 accept/reject    （GRAD 模型 B）
#      think1_prof_model：专业思考（t1-p）专家：校验依赖/资源/目标     （GRAD 模型 C）
# 4、填写规则：
#  - 留空 "" = 使用默认模型（llm.model，高级模式为 global.default_model），三个角色共用同一模型；
#  - 填不同模型 = 三个角色分工。示例：
#      think2_slow_model: "deepseek-v4-pro"     # 慢思考用最强的大模型
#      think1_fast_model: "deepseek-v4-flash"   # 快思考用快速的小模型
#      think1_prof_model: "opus-1.5b"           # 专业思考用特点强的模型
# 5、开关：
#  - enabled: true → 启用双思考（GRAD 批判循环）
#  - enabled: false → 关闭双思考（GRAD 批判循环），退化为单轮普通计划。
# 6、临时覆盖：
#  - env 变量覆盖：env AIRY_THINK_ENABLED / AIRY_THINK2_SLOW_MODEL / AIRY_THINK1_FAST_MODEL / AIRY_THINK1_PROF_MODEL / AIRY_THINK_TIMEOUT_MS
# 7、优先级：
#  - env > model.yaml think 段 > think_d 的 -c JSON 配置 > 默认。

# ★ Thinkdual配置
think:
  enabled: true              # true=启用双思考；false=关闭（退化为单轮计划）
  think2_slow_model: "deepseek-v4-pro"      # 慢思考（t2）最强模型：行动计划质量决定任务执行成败
  think1_fast_model: "deepseek-v4-flash"    # 快思考（t1-f）快速终裁
  think1_prof_model: "deepseek-v4-flash"    # 专业思考（t1-p）默认模型
  timeout_ms: 120000         # 单次双思考处理超时（毫秒）

# 配置归属（按双重责任模型）
_owner:
  module: "llm_d"
  contact: "llm-team@example.com"
  path: "AgentRT/agentrt/daemons/llm_d"
  description: "内容定义责任归属 llm_d 模块，管理责任归属 Manager 模块"

# 配置版本
_config_version: "1.0.0"

# Schema 引用
_schema: "schema/model.schema.json"

# =============================================================================
# 提供商配置（llm_d 经 providers 数组加载；模型详情见下方 models 列表）
# 与 model.json 保持同源，修改须同步两份文件
# =============================================================================
providers:
  - name: "openai"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4-turbo"
    timeout_sec: 60
    max_retries: 3
    models: ["gpt-4", "gpt-4-turbo", "gpt-3.5-turbo", "text-embedding-3-small", "text-embedding-3-large"]

  - name: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com"
    default_model: "claude-3-sonnet"
    timeout_sec: 120
    max_retries: 3
    models: ["claude-3-opus", "claude-3-sonnet", "claude-3-haiku"]

  - name: "deepseek"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    default_model: "deepseek-v4-flash"
    timeout_sec: 120
    max_retries: 3
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]

  - name: "google"
    api_key_env: "GOOGLE_AI_API_KEY"
    base_url: "https://generativelanguage.googleapis.com"
    default_model: "gemini-pro"
    timeout_sec: 60
    max_retries: 3
    models: ["gemini-pro", "gemini-pro-vision"]

  - name: "local"
    api_key_env: ""
    base_url: "http://localhost:11434"
    default_model: "llama-3-70b"
    timeout_sec: 120
    max_retries: 2
    models: ["llama-3-70b"]

  # ===========================================================================
  # 国内 OpenAI 兼容厂商（统一走 OpenAI Chat Completions 协议，无需新 provider
  # 实现；llm_d 对未知 provider 名自动走 openai 兼容适配器）
  # ===========================================================================

  - name: "glm"
    api_key_env: "GLM_API_KEY"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    default_model: "glm-4-flash"
    timeout_sec: 120
    max_retries: 3
    models: ["glm-4-flash", "glm-4-air", "glm-4-plus"]

  - name: "qwen"
    api_key_env: "DASHSCOPE_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    default_model: "qwen-plus"
    timeout_sec: 120
    max_retries: 3
    models: ["qwen-turbo", "qwen-plus", "qwen-max", "qwen-long"]

  - name: "moonshot"
    api_key_env: "MOONSHOT_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "moonshot-v1-8k"
    timeout_sec: 120
    max_retries: 3
    models: ["moonshot-v1-8k", "moonshot-v1-32k", "moonshot-v1-128k"]

  - name: "siliconflow"
    api_key_env: "SILICONFLOW_API_KEY"
    base_url: "https://api.siliconflow.cn/v1"
    default_model: "Qwen/Qwen2.5-7B-Instruct"
    timeout_sec: 120
    max_retries: 3
    models: ["Qwen/Qwen2.5-7B-Instruct", "deepseek-ai/DeepSeek-V3"]

  - name: "spark"
    api_key_env: "SPARK_API_KEY"
    base_url: "https://spark-api-open.xf-yun.com/v1"
    default_model: "generalv3.5"
    timeout_sec: 120
    max_retries: 3
    models: ["generalv3.5", "generalv3"]

  # 自定义 OpenAI 兼容 provider 模板：复制为任一名称，填 base_url + key 即可
  - name: "custom"
    api_key_env: "CUSTOM_LLM_API_KEY"
    base_url: "https://your-endpoint.example.com/v1"
    default_model: "your-model"
    timeout_sec: 120
    max_retries: 3
    models: ["your-model"]

# =============================================================================
# 模型配置列表
# =============================================================================
models:
  # ===========================================================================
  # OpenAI 模型
  # ===========================================================================
  - name: "gpt-4"
    provider: "openai"
    api_key_env: "OPENAI_API_KEY"
    endpoint: "https://api.openai.com/v1/chat/completions"
    context_window: 128000
    input_cost_per_1k: 0.03
    output_cost_per_1k: 0.06
    capabilities: ["chat", "function_calling", "json_mode", "streaming"]
    default: false
    max_concurrency: 10
    timeout_sec: 60
    
    # 重试配置
    retry:
      max_attempts: 3
      backoff_ms: 100
      backoff_multiplier: 2.0
      max_backoff_ms: 10000
      retry_on_status_codes: [429, 500, 502, 503, 504]
    
    # 熔断器配置
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout_sec: 60
      half_open_requests: 3
      success_threshold: 2
    
    # 降级配置
    fallback:
      enabled: true
      fallback_model: "gpt-4-turbo"
      fallback_on_timeout: true
      fallback_on_rate_limit: true
      fallback_on_error: true
    
    # 健康检查
    health_check:
      enabled: true
      interval_sec: 30
      timeout_sec: 5
      unhealthy_threshold: 3
    
    # 速率限制
    rate_limit:
      requests_per_minute: 500
      tokens_per_minute: 100000

  - name: "gpt-4-turbo"
    provider: "openai"
    api_key_env: "OPENAI_API_KEY"
    endpoint: "https://api.openai.com/v1/chat/completions"
    context_window: 128000
    input_cost_per_1k: 0.01
    output_cost_per_1k: 0.03
    capabilities: ["chat", "function_calling", "json_mode", "vision", "streaming"]
    default: false
    max_concurrency: 20
    timeout_sec: 60
    
    retry:
      max_attempts: 3
      backoff_ms: 100
      backoff_multiplier: 2.0
      max_backoff_ms: 10000
      retry_on_status_codes: [429, 500, 502, 503, 504]
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout_sec: 60
      half_open_requests: 3
      success_threshold: 2
    
    fallback:
      enabled: true
      fallback_model: "gpt-3.5-turbo"
      fallback_on_timeout: true
      fallback_on_rate_limit: true
      fallback_on_error: true
    
    health_check:
      enabled: true
      interval_sec: 30
      timeout_sec: 5
      unhealthy_threshold: 3
    
    rate_limit:
      requests_per_minute: 1000
      tokens_per_minute: 200000

  - name: "gpt-3.5-turbo"
    provider: "openai"
    api_key_env: "OPENAI_API_KEY"
    endpoint: "https://api.openai.com/v1/chat/completions"
    context_window: 16000
    input_cost_per_1k: 0.0015
    output_cost_per_1k: 0.002
    capabilities: ["chat", "function_calling", "streaming"]
    default: false
    max_concurrency: 50
    timeout_sec: 30
    
    retry:
      max_attempts: 3
      backoff_ms: 50
      backoff_multiplier: 2.0
      max_backoff_ms: 5000
    
    circuit_breaker:
      enabled: true
      failure_threshold: 10
      reset_timeout_sec: 30
    
    fallback:
      enabled: false

  # ===========================================================================
  # Anthropic 模型
  # ===========================================================================
  - name: "claude-3-opus"
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    endpoint: "https://api.anthropic.com/v1/messages"
    context_window: 200000
    input_cost_per_1k: 0.015
    output_cost_per_1k: 0.075
    capabilities: ["chat", "vision", "streaming"]
    default: false
    max_concurrency: 10
    timeout_sec: 120
    
    retry:
      max_attempts: 3
      backoff_ms: 100
      backoff_multiplier: 2.0
      max_backoff_ms: 10000
      retry_on_status_codes: [429, 500, 502, 503, 504]
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout_sec: 60
    
    fallback:
      enabled: true
      fallback_model: "claude-3-sonnet"
      fallback_on_timeout: true
      fallback_on_rate_limit: true
      fallback_on_error: true
    
    health_check:
      enabled: true
      interval_sec: 30
      timeout_sec: 10

  - name: "claude-3-sonnet"
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    endpoint: "https://api.anthropic.com/v1/messages"
    context_window: 200000
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
    capabilities: ["chat", "streaming"]
    default: false
    max_concurrency: 20
    timeout_sec: 60
    
    retry:
      max_attempts: 3
      backoff_ms: 100
      backoff_multiplier: 2.0
      max_backoff_ms: 10000
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout_sec: 60
    
    fallback:
      enabled: true
      fallback_model: "claude-3-haiku"

  - name: "claude-3-haiku"
