# 本文件是 AgentRT LLM 配置的唯一权威源（SSoT）。安装/构建时由
# agentrt-bootstrap.sh / release.yml / package-full-release.sh 拷贝到
# 运行环境 $AIRY_HOME/config/model.yaml，两侧内容保持一致。
#
# v3 表格形式：每行一个模型连接（数量不限，引擎上限 64）+ 双思考系统
# 独立配置。字段统一抽象，不区分厂商：用户只需填 线格式（chat/messages/local）、
# 地址、模型名，即可接入任意厂商 API 或本地模型。
# 旧 providers/global/routing 长清单已移除。
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# ★ 模型连接表（每行一个模型；数量不限）
# ─────────────────────────────────────────────────────────────────────────────
# 必填字段：
#   name          展示名称（自定义，如 "DeepSeek" / "本地模型"）
#   mode          api（云端 API）| local（本地模型）
#   api_format    chat（Chat Completions 线格式）| messages（Messages 线格式）
#                 | local（本地运行时）
#   base_url      服务根地址（适配器持有请求路径，此处不含 /chat/completions 或
#                 /messages 后缀）
#   model_id      模型 ID（实际调用时使用的模型名）
#   api_key_env   secrets.env 中的变量名（可省略/留空）：
#                 - 缺省/留空时自动按表格行号映射 MODEL_<行号>_API_KEY
#                   （第 1 行 → MODEL_1_API_KEY，第 2 行 → MODEL_2_API_KEY，…）
#                 - 仅需自定义变量名时才显式填写
#                 - local（本地模型）无需 key，可留空
#
# ★ 如何添加新模型（两步，不增加配置复杂度）：
#   1) 在本表追加一行（name/mode/api_format/base_url/model_id）
#   2) 在 secrets.env 追加一个 Key 位：MODEL_<新行号>_API_KEY=xxx
#   示例（追加为第 4 行时）：
#     - name: Qwen
#       mode: api
#       api_format: chat
#       base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#       model_id: qwen-max
#     secrets.env 加一行：MODEL_4_API_KEY=sk-xxxx
#
# 高级配置（可选，缺省用默认值）：
#   context_window   上下文窗口：128k|256k|512k|1M|2M（默认 128k）
#   max_output       最大输出 token：4k|16k|32k|128k|256k（默认 16k）
#   tool_rounds      工具调用轮数（默认 1000）
#   vision           图片输入：true|false（默认 false）
#   thinking         思考模式：auto（跟随模型默认）|on|off（默认 auto）
#   extra_headers    端点附加请求头，形如 "anthropic-version: 2023-06-01"；
#                    多条以 ';' 或换行分隔（Messages 线格式必需协议版本头）
#   input_cost_per_1k   输入单价（美元/千 token，可选；缺失落默认价）
#   output_cost_per_1k  输出单价（美元/千 token，可选；缺失落默认价）
#   provision           managed（端点由 supervisor 托管的本地进程提供）|
#                       external（端点由外部服务提供）；仅托管场景需声明
#   artifact            托管工件路径（可选）。标准安装下工件位置由
#                       airy-local 注册表与 config/managed.d 片段权威持有，
#                       此处留空即可，避免两处 SSoT 漂移
#   capabilities        上游能力位显式声明（seed|grammar|num_ctx|
#                       response_format|cache_prompt|slot_id|enable_thinking|
#                       thinking_budget）；整表替换派生值，未列位按 false 处理，
#                       不声明即按端点类型派生
models:
  - name: DeepSeek
    mode: api
    api_format: chat
    base_url: https://api.deepseek.com
    model_id: deepseek-flash
    api_key_env: MODEL_1_API_KEY
    context_window: 128k
    max_output: 16k
    tool_rounds: 1000
    vision: false
    thinking: auto
    input_cost_per_1k: 0.00015   # $0.15/M tokens（deepseek-flash 标准时段，未命中缓存）
    output_cost_per_1k: 0.0006   # $0.60/M tokens（deepseek-flash 标准时段）

  - name: GLM
    mode: api
    api_format: chat
    base_url: https://open.bigmodel.cn/api/paas/v4
    model_id: GLM-4.7-Flash
    api_key_env: MODEL_2_API_KEY
    context_window: 128k
    max_output: 16k
    tool_rounds: 1000
    vision: false
    thinking: auto
    input_cost_per_1k: 0.0        # 免费额度模型，显式 0 避免落默认价
    output_cost_per_1k: 0.0

  # 自托管本地推理：端点由 supervisor 托管的 llama-server 提供（端口
  # 11435 为自托管专用口，与 Ollama 的 11434 分离，互不抢占）。模型 pin
  # 见 tools/scripts/ops/templates/llama-models.list，工件由
  # `airy-local model install` 落位。
  - name: 本地模型
    mode: local
    api_format: local
    base_url: http://127.0.0.1:11435/v1
    model_id: qwen3-0.6b-q8_0
    api_key_env: ""
    provision: managed
    capabilities:
      seed: true
      grammar: true
      response_format: true
      cache_prompt: true
      enable_thinking: true
    context_window: 128k
    max_output: 16k
    tool_rounds: 1000
    vision: false
    thinking: auto
    input_cost_per_1k: 0.0       # 免费模型显式 0，不落默认价
    output_cost_per_1k: 0.0

# ── 默认模型（必填，须为上方 models 表中某一行的 model_id）───────────────
default_model: deepseek-flash

# ── 性能模式（可选，缺省 full；env AIRY_PERF_MODE 覆盖）─────────────────
# 设备级策略包络，用于在低算力端侧（纯 CPU / 小内存 / 端侧 SoC）上保障首字
# 延迟与长时间运行稳定性，取值：
#   full        完整能力（云端 / 中高端设备）；默认值，现网行为零变化。
#   lightweight 低算力路径：think.enabled 失效，关闭 GRAD 批判环，走单轮
#               直连降级路径。适用于本地 7B 级别模型、无 GPU 的端侧环境。
#   auto        仅探测与提示：首字延迟超阈值时在日志 / status 中提示，不
#               改写本配置（配置自写会破坏机制与策略分离）。
# 临时覆盖（env 优先级最高；取值同名且大小写不敏感）：
#   AIRY_PERF_MODE=full|lightweight|auto
performance_mode: full

# ─────────────────────────────────────────────────────────────────────────────
# ★ 双思考系统（Thinkdual / GRAD 批判循环）
# ─────────────────────────────────────────────────────────────────────────────
# 说明：
#  - enabled: true  → 对话先经批判循环（GRAD）产出收敛的 DAG 行动计划，
#    再交 LLM 按计划回答（慢思考组织逻辑、快/专业思考校验终裁）。
#  - enabled: false → 关闭双思考，退化为单轮普通计划。
#  - 三个思考角色模型：填上方 models 表中的 model_id；留空 "" = 默认模型
#    （default_model），三个角色共用。
#      think2_slow_model  慢思考（t2）生成行动计划        （GRAD 模型 A）
#      think1_fast_model  快思考（t1-f）对计划终裁        （GRAD 模型 B）
#      think1_prof_model  专业思考（t1-p）专家校验        （GRAD 模型 C）
#  - 临时覆盖（env 优先级最高）：
#      AIRY_THINK_ENABLED / AIRY_THINK2_SLOW_MODEL /
#      AIRY_THINK1_FAST_MODEL / AIRY_THINK1_PROF_MODEL / AIRY_THINK_TIMEOUT_MS
#  - 优先级：env > 本段 > think_d -c JSON 配置 > 默认。
think:
  enabled: true
  think2_slow_model: ""
  think1_fast_model: ""
  think1_prof_model: ""
  timeout_ms: 120000

# ─────────────────────────────────────────────────────────────────────────────
# ★ 调用级切换（routing，0.1.19 §3.8）
# ─────────────────────────────────────────────────────────────────────────────
# 整段默认注释：mode 缺省 off，行为与历史版本完全一致（不记健康面、不枚举
# 候选、不耗预算，失败原样透传）。需要「一次 llm.call 内失败换端点」时，
# 取消下面注释并按需调整：
#   mode          off（默认）| auto
#   chain_depth   最多切换跳数（缺省 2，上限 SVC_CHAIN_MAX_TRIED）
#   on            可切换的错误类：transport | rate_limit | auth
#                 （缺省即三类；显式空表 [] 表示禁止一切切换）
#   deadline_sec  单次 llm.call 总预算（秒，<=0 不限）
# routing:
#   mode: auto
#   chain_depth: 2
#   on: [transport, rate_limit, auth]
#   deadline_sec: 60

# ─────────────────────────────────────────────────────────────────────────────