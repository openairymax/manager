# =============================================================================
# 全局模型配置
# =============================================================================
global:
  # 默认提供商
  default_provider: "deepseek"
  
  # 默认模型
  default_model: "deepseek-v4-flash"
  
  # 默认嵌入模型
  default_embedding_model: "text-embedding-3-small"
  
  # 全局超时
  default_timeout_sec: 60
  
  # 全局重试
  default_retry:
    max_attempts: 3
    backoff_ms: 100
    backoff_multiplier: 2.0
    max_backoff_ms: 10000
  
  # 全局熔断器
  default_circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_sec: 60
    half_open_requests: 3
    success_threshold: 2
  
  # 全局健康检查
  default_health_check:
    enabled: true
    interval_sec: 30
    timeout_sec: 5
    unhealthy_threshold: 3

# =============================================================================
# 模型路由规则
# =============================================================================
routing:
  # 基于任务类型的模型选择
  task_type_mapping:
    planning: "gpt-4"
    coding: "gpt-4-turbo"
    analysis: "claude-3-opus"
    chat: "gpt-3.5-turbo"
    embedding: "text-embedding-3-small"
  
  # 基于复杂度的模型选择
  complexity_mapping:
    high: "gpt-4"
    medium: "gpt-4-turbo"
    low: "gpt-3.5-turbo"
  
  # 基于成本的模型选择
  cost_optimization:
    enabled: true
    prefer_cheaper: false
    max_cost_per_request: 1.0  # USD
