      max_backoff_ms: 10000
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout_sec: 60
    
    fallback:
      enabled: true
      fallback_model: "gpt-3.5-turbo"

  # ===========================================================================
  # Ollama 本地模型（provider 名与 providers 列表一致：local）
  # ===========================================================================
  - name: "llama-3-70b"
    provider: "local"
    endpoint: "${OLLAMA_HOST:-http://localhost:11434}/api/chat"
    context_window: 8192
